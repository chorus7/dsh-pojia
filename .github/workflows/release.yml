name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check select.mjs
          node --check selfcheck.mjs
          node --check build.mjs

      - name: Self-check
        run: node selfcheck.mjs "$PWD"

      - name: Build package
        run: node build.mjs --out "$PWD/out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pojia-release
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/dsh-pojia-prompt-*.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
